name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "== Android SDK =="
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            if [ ! -d "$SDK/cmdline-tools" ]; then
              echo "SDK not found, installing command-line tools"
              SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
              curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
            export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
            echo "sdk.dir=$SDK" > local.properties
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
            echo "Using $SDKM"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || echo "sdkmanager install warning"
            echo "== Gradle build =="
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee build.log

      # Результат (APK или лог ошибки) кладётся в ветку «builds» —
      # оттуда его забирает Claude и присылает в чат.
      - name: Publish result to 'builds' branch
        if: always()
        run: |
          mkdir out
          grep -E "^e: |error:|FAILURE|What went wrong" -A 3 build.log | head -300 > out/errors.txt || true
          tail -n 200 build.log > out/build-tail.log || true
          cp app/build/outputs/apk/release/*.apk "out/Helper by cbz.apk" 2>/dev/null || true
          echo "${{ steps.build.outcome }} ${GITHUB_SHA}" > out/STATUS
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Helper by cbz
          path: app/build/outputs/apk/release/*.apk

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
