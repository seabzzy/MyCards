name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Результат (APK или лог ошибки) кладётся в ветку «builds» —
      # оттуда его забирает Claude и присылает в чат.
      - name: Publish result to 'builds' branch
        if: always()
        run: |
          mkdir out
          grep -E "^e: |error:|FAILURE|What went wrong" -A 3 build.log | head -300 > out/errors.txt || true
          tail -n 200 build.log > out/build-tail.log || true
          cp app/build/outputs/apk/release/*.apk out/MyCards.apk 2>/dev/null || true
          echo "${{ steps.build.outcome }} ${GITHUB_SHA}" > out/STATUS
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: MyCards-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
